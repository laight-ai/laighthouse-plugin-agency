<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
/*__KIT_CSS__*/
.cr-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; font-size: 13px; color: var(--label); }
.cr-chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 13px;
  font-weight: 600; cursor: pointer; color: var(--label); }
.cr-chip.is-on { background: #eff6ff; border-color: var(--accent); color: var(--accent); }
.cr-sum { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; padding: 12px 16px; border: 1px solid var(--line);
  border-radius: 10px; font-size: 13px; color: var(--label); }
.cr-sum b { font-size: 16px; color: var(--ink); margin-right: 4px; }
.cr-sum span strong { color: var(--ink); }
.cr-tbl { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
.cr-tbl th { text-align: right; font-weight: 600; color: var(--label); padding: 8px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.cr-tbl td { text-align: right; padding: 8px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
.cr-tbl th:nth-child(-n+3), .cr-tbl td:nth-child(-n+3) { text-align: left; }
.cr-tbl td.cr-name { white-space: normal; min-width: 140px; max-width: 260px; }
.cr-name small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
.cr-rank { color: var(--muted); width: 20px; }
.cr-th { width: 72px; height: 48px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: #fafaf9;
  display: flex; align-items: center; justify-content: center; }
.cr-th img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; }
.cr-th svg { width: 100%; height: 100%; }
.cr-hl { color: var(--accent); font-weight: 700; }
.cr-note { font-size: 12px; color: var(--muted); margin-top: 8px; }
.cr-wrap { overflow-x: auto; }
.cr-zoom { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: none; align-items: center; justify-content: center; z-index: 9; cursor: zoom-out; }
.cr-zoom img { max-width: 90vw; max-height: 90vh; border-radius: 8px; }
.cr-zoom.is-on { display: flex; }
.lh-page { max-width: 1240px; }   /* 세부 표의 지표 열이 넉넉히 보이게 */
/* 추이 */
.tr-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
.tr-box { position: relative; height: 300px; margin-top: 12px; }
/* 세부 광고 성과 — 웹 보고서 세부 표(MetricTree 기간 뷰)와 같은 모양 */
.dt-tools { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.dt-tools input { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px; width: 180px; }
.dt-seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.dt-seg button { border: none; background: #fff; padding: 5px 12px; font: inherit; font-size: 12px; cursor: pointer; color: var(--label); }
.dt-seg button + button { border-left: 1px solid var(--line); }
.dt-seg button.is-on { background: var(--accent); color: #fff; }
.dt-k { font-size: 12px; color: var(--muted); }
.dt-scroll { overflow: auto; max-height: 720px; border: 1px solid var(--line); border-radius: 8px; margin-top: 12px; }
.dt-tbl { border-collapse: separate; border-spacing: 0; font-size: 13px; width: max-content; min-width: 100%; }
.dt-tbl th, .dt-tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line); border-right: 1px solid #f0efee; white-space: nowrap; background: #fff; }
.dt-tbl thead th { position: sticky; top: 0; z-index: 2; background: #f8fafc; font-weight: 600; color: var(--label); text-align: left; }
.dt-tbl th.num, .dt-tbl td.num { text-align: right; min-width: 110px; }
.dt-tbl th.num { cursor: pointer; user-select: none; }
.dt-tbl th.num .ar { color: var(--muted); font-size: 11px; margin-left: 4px; }
.dt-tbl .lv { min-width: 150px; max-width: 220px; }
.dt-tbl .sticky { position: sticky; left: 0; z-index: 1; box-shadow: 2px 0 0 #e7e5e4; }
.dt-tbl thead .sticky { z-index: 3; }
.dt-tbl tr.lv-1 td { background: #f8fafc; }
.dt-item { display: inline-flex; align-items: center; gap: 4px; max-width: 220px; }
.dt-item .tx { overflow: hidden; text-overflow: ellipsis; }
.dt-car { width: 16px; color: #64748b; cursor: pointer; font-size: 11px; flex: none; }
.dt-all { color: var(--muted); }
.dt-v { display: inline-flex; flex-direction: column; align-items: flex-end; line-height: 18px; }
.dt-d { font-size: 11px; color: var(--muted); }
.dt-d.is-up { color: #dc2626; } .dt-d.is-down { color: #2563eb; }
.dt-img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; cursor: zoom-in; border: 1px solid var(--line); display: block; margin: 0 auto; }
</style>
<script>/*__CHART_JS__*/</script>
</head>
<body>
<div class="lh-page">
  <header class="lh-header">
    <div>
      <h1 id="title"></h1>
      <div class="lh-meta" id="period"></div>
    </div>
    <button class="lh-print" onclick="window.print()">PDF로 저장</button>
  </header>
  <section class="lh-section">
    <div class="cr-bar">
      <span>매체</span><span id="media-chips" style="display:flex;gap:6px;flex-wrap:wrap"></span>
      <span style="margin-left:auto">TOP 기준</span><span id="sort-chips" style="display:flex;gap:6px;flex-wrap:wrap"></span>
    </div>
  </section>
  <section class="lh-section" id="summary-sec">
    <h2>소재 Summary</h2>
    <div class="lh-meta" id="summary-meta"></div>
    <div id="summary" style="margin-top:12px"></div>
  </section>
  <section class="lh-section" id="trend-sec">
    <div class="lh-section-head">
      <div><h2>일별 추이</h2><div class="lh-meta">매체 칩으로 고른 매체만 · 전체는 고른 매체의 합</div></div>
    </div>
    <div class="tr-bar">
      <span class="dt-seg" id="tr-view"></span>
      <span class="dt-k">지표</span><span id="tr-metric" style="display:flex;gap:6px;flex-wrap:wrap"></span>
    </div>
    <div class="tr-box"><canvas id="tr-cv"></canvas></div>
  </section>
  <div id="groups" style="display:flex;flex-direction:column;gap:16px"></div>
  <section class="lh-section" id="detail">
    <div class="lh-section-head">
      <div><h2>세부 광고 성과</h2><div class="lh-meta" id="dt-meta"></div></div>
      <div class="dt-tools">
        <input id="dt-q" placeholder="검색" aria-label="세부 광고 성과 검색">
        <span class="dt-k">펼칠 단계</span><span class="dt-seg" id="dt-depth"></span>
      </div>
    </div>
    <div class="dt-scroll"><table class="dt-tbl" id="dt"></table></div>
  </section>
  <div class="lh-footer">— by LaightAI</div>
</div>
<div class="cr-zoom" id="zoom" onclick="this.classList.remove('is-on')"><img alt=""></div>
<script>
const D = "__DATA__";
const st = { sort: D.sort, hidden: new Set() };
const cur = D.currency;
const f = {
  int: v => v == null ? '-' : Math.round(v).toLocaleString('ko-KR'),
  money: v => v == null ? '-' : cur + Math.round(v).toLocaleString('ko-KR'),
  big: v => v == null ? '-' : v >= 1e6 ? cur + (v / 1e6).toFixed(1) + 'M' : cur + Math.round(v).toLocaleString('ko-KR'),
  ctr: v => v == null ? '-' : v.toFixed(2) + '%',
  pct: v => v == null ? '-' : v.toFixed(1) + '%',
};
const COLS = [['impression', '노출', 'int'], ['click', '클릭', 'int'], ['ctr', 'CTR', 'ctr'], ['cpc', 'CPC', 'money'], ['cost', '비용', 'big']]
  .concat(D.has.conversion ? [['conversion', '전환', 'int'], ['cvr', 'CVR', 'pct']] : [])
  .concat(D.has.revenue ? [['roas', 'ROAS', 'pct']] : []);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const NOIMG = '<svg viewBox="0 0 72 48" preserveAspectRatio="none"><path d="M0 0L72 48M72 0L0 48" stroke="#a8a29e" stroke-width="1.5"/></svg>';

function rank(rows, sort) {
  let pool = rows, fallback = false;
  if (sort === 'ctr' || sort === 'roas') {
    const total = rows.reduce((a, r) => a + r.cost, 0);
    pool = rows.filter(r => r.impression >= D.min.impression && r.cost >= total * D.min.share);
    if (!pool.length) { pool = rows; fallback = true; }
    pool = pool.filter(r => r[sort] != null);
  }
  pool = pool.slice().sort((a, b) => (b[sort] || 0) - (a[sort] || 0) || b.cost - a.cost);
  return { top: pool.slice(0, D.top), fallback };
}

function chips(el, items, isOn, onClick) {
  el.innerHTML = '';
  items.forEach(([k, label]) => {
    const b = document.createElement('button');
    b.className = 'cr-chip' + (isOn(k) ? ' is-on' : '');
    b.textContent = label;
    b.onclick = () => { onClick(k); draw(); };
    el.appendChild(b);
  });
}

function draw() {
  chips(document.getElementById('media-chips'), D.media.map(g => [g.summary.media, g.summary.media]),
    k => !st.hidden.has(k), k => st.hidden.has(k) ? st.hidden.delete(k) : st.hidden.add(k));
  chips(document.getElementById('sort-chips'), D.sorts, k => k === st.sort, k => { st.sort = k; });
  const sortLabel = (D.sorts.find(s => s[0] === st.sort) || [, ''])[1];
  const box = document.getElementById('groups');
  box.innerHTML = D.media.filter(g => !st.hidden.has(g.summary.media)).map(g => {
    const m = g.summary, r = rank(g.rows, st.sort);
    const tail = D.has.revenue ? `<span>ROAS <strong>${f.pct(m.roas)}</strong></span>` : `<span>CPC <strong>${f.money(m.cpc)}</strong></span>`;
    const body = r.top.map((x, i) => `<tr><td class="cr-rank">${i + 1}</td>
      <td><div class="cr-th">${x.thumb ? `<img src="${x.thumb}" alt="">` : NOIMG}</div></td>
      <td class="cr-name">${esc(x.name)}<small>${esc(x.campaign_name || '')}${x.ad_group_name ? ' › ' + esc(x.ad_group_name) : ''}</small></td>
      ${COLS.map(c => `<td class="${c[0] === st.sort ? 'cr-hl' : ''}">${f[c[2]](x[c[0]])}</td>`).join('')}</tr>`).join('');
    return `<section class="lh-section">
      <div class="cr-sum"><b>${esc(m.media)}</b><span>비용 <strong>${f.money(m.cost)}</strong></span>
        <span>CTR <strong>${f.ctr(m.ctr)}</strong></span>${tail}<span>소재 ${m.creatives}개</span></div>
      <h2 style="margin-top:14px">${esc(m.media)} 소재 TOP ${D.top} · ${esc(sortLabel)} 기준</h2>
      <div class="cr-wrap"><table class="cr-tbl"><thead><tr><th></th><th>썸네일</th><th>소재명</th>
        ${COLS.map(c => `<th>${c[1]}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>
      ${r.fallback ? '<div class="cr-note">최소 표본(노출 1,000·광고비 1%)을 채운 소재가 없어 전체 소재로 순위를 냈습니다.</div>' : ''}
    </section>`;
  }).join('') || '<section class="lh-section">선택한 매체가 없습니다.</section>';
  drawTree();   // 매체 칩이 세부 표·추이에도 적용된다
  drawTrend();
}

// ── 세부 광고 성과: 웹 보고서 세부 표(MetricTree 기간 뷰)와 같은 규칙 ──
//  단계마다 열(매체·캠페인·광고그룹·광고), 하위가 있는 줄은 다음 단계 칸에 '전체', 이미지 열은 이번 기간 소재 썸네일만.
//  증감: 비율 지표는 %p(차), 나머지는 변화율 — 직전 값이 0이거나 없으면 '—'. 오름 = 빨강 ▲, 내림 = 파랑 ▼.
const A = { cost: 0, impression: 1, click: 2, conversion: 3, revenue: 4 };
const ratio = (a, b, k = 1) => b ? a / b * k : null;   // 분모 0 → 값 없음
const DM = [
  ['광고비', v => v[A.cost], 'money', 0], ['노출', v => v[A.impression], 'int', 0], ['클릭', v => v[A.click], 'int', 0],
  ['CTR', v => ratio(v[A.click], v[A.impression], 100), 'ctr', 1], ['CPC', v => ratio(v[A.cost], v[A.click]), 'money', 0],
].concat(D.has.conversion ? [['전환', v => v[A.conversion], 'int', 0], ['CVR', v => ratio(v[A.conversion], v[A.click], 100), 'pct', 1]] : [])
 .concat(D.has.revenue ? [['ROAS', v => ratio(v[A.revenue], v[A.cost], 100), 'pct', 1]] : []);
const LV = ['매체', '캠페인', '광고그룹', '광고'];
const DASH = '<span class="dt-d">—</span>';
function change(n, m) {
  if (!D.prev.ok || !n.p) return DASH;
  const a = m[1](n.p), b = m[1](n.c);
  if (a == null || b == null) return DASH;
  let c;
  if (m[3]) c = b - a;
  else { if (a === 0) return DASH; c = (b - a) / Math.abs(a) * 100; }
  const r = Math.round(c * 10) / 10;
  const cls = r > 0 ? 'is-up' : r < 0 ? 'is-down' : '';
  return `<span class="dt-d ${cls}">${r > 0 ? '▲ ' : r < 0 ? '▼ ' : ''}${Math.abs(r).toFixed(1)}${m[3] ? '%p' : '%'}</span>`;
}
// 하위가 같은 이름의 소재 하나뿐인 줄은 한 줄로 합친다(웹과 같음)
(function collapse(ns) {
  ns.forEach(n => {
    collapse(n.k);
    if (n.k.length === 1 && !n.k[0].k.length && n.k[0].n === n.n) { n.t = n.k[0].t; n.k = []; }
  });
})(D.tree);
let uid = 0;
(function tag(ns, d) { ns.forEach(n => { n.id = ++uid; n.d = d; tag(n.k, d + 1); }); })(D.tree, 0);
const dt = { open: new Set(), depth: 0, sort: null, q: '' };
const hasImg = ns => ns.some(n => n.t || hasImg(n.k));
const maxLv = ns => ns.reduce((a, n) => Math.max(a, n.d, maxLv(n.k)), 0);
function sorted(ns) {
  if (!dt.sort) return ns;
  const m = DM[dt.sort.i], s = dt.sort.dir === 'asc' ? 1 : -1;
  const val = n => { const v = m[1](n.c); return v == null ? -Infinity : v; };
  return ns.slice().sort((a, b) => (val(a) - val(b)) * s);
}
const matches = n => n.n.toLowerCase().includes(dt.q) || n.k.some(matches);
function drawTree() {
  const roots = D.tree.filter(n => !st.hidden.has(n.n));
  const img = hasImg(roots), levels = LV.slice(0, maxLv(roots) + 1);
  const head = `<thead><tr>${levels.map((l, i) => `<th class="lv${i === 0 ? ' sticky' : ''}">${l}</th>`).join('')}`
    + (img ? '<th style="width:64px;text-align:center">이미지</th>' : '')
    + DM.map((m, i) => `<th class="num" data-i="${i}">${m[0]}<span class="ar">${dt.sort && dt.sort.i === i ? (dt.sort.dir === 'asc' ? '▲' : '▼') : '⇕'}</span></th>`).join('')
    + '</tr></thead>';
  const out = [];
  (function walk(ns) {
    sorted(ns).forEach(n => {
      if (dt.q && !matches(n)) return;
      const kids = n.k.length > 0, isOpen = dt.q ? true : dt.open.has(n.id);
      const cells = levels.map((_, lv) => {
        let inner = '';
        if (n.d === lv) inner = `<span class="dt-item">${kids ? `<span class="dt-car" data-id="${n.id}">${isOpen ? '▼' : '▶'}</span>` : '<span class="dt-car"></span>'}<span class="tx" title="${esc(n.n)}">${esc(n.n)}</span></span>`;
        else if (n.d + 1 === lv && kids) inner = '<span class="dt-all">전체</span>';
        return `<td class="lv${lv === 0 ? ' sticky' : ''}">${inner}</td>`;
      }).join('');
      out.push(`<tr class="lv-${n.d}">${cells}` + (img ? `<td>${n.t ? `<img class="dt-img" src="${n.t}" alt="${esc(n.n)}">` : ''}</td>` : '')
        + DM.map(m => `<td class="num"><span class="dt-v"><span>${f[m[2]](m[1](n.c))}</span>${change(n, m)}</span></td>`).join('') + '</tr>');
      if (kids && isOpen) walk(n.k);
    });
  })(roots);
  document.getElementById('dt').innerHTML = head + '<tbody>'
    + (out.join('') || `<tr><td colspan="${levels.length + DM.length + 1}">검색 결과가 없습니다.</td></tr>`) + '</tbody>';
  document.getElementById('dt-depth').innerHTML = LV.slice(1, levels.length).map((l, i) =>
    `<button data-d="${i + 1}" class="${dt.depth === i + 1 ? 'is-on' : ''}">${l}</button>`).join('');
}
document.getElementById('dt').addEventListener('click', e => {
  const c = e.target.closest('.dt-car[data-id]');
  if (c) { const id = +c.dataset.id; dt.open.has(id) ? dt.open.delete(id) : dt.open.add(id); return drawTree(); }
  const th = e.target.closest('th.num');
  if (th) {   // 내림 → 오름 → 해제
    const i = +th.dataset.i;
    dt.sort = !dt.sort || dt.sort.i !== i ? { i, dir: 'desc' } : dt.sort.dir === 'desc' ? { i, dir: 'asc' } : null;
    return drawTree();
  }
  if (e.target.matches('.dt-img')) {
    const z = document.getElementById('zoom'); z.querySelector('img').src = e.target.src; z.classList.add('is-on');
  }
});
document.getElementById('dt-depth').addEventListener('click', e => {
  const b = e.target.closest('button[data-d]');
  if (!b) return;
  const d = +b.dataset.d;
  dt.depth = dt.depth === d ? 0 : d;   // 펼칠 단계: 그 단계까지 펼친다, 다시 누르면 접기
  dt.open.clear();
  (function op(ns) { ns.forEach(n => { if (n.d < dt.depth && n.k.length) { dt.open.add(n.id); op(n.k); } }); })(D.tree);
  drawTree();
});
document.getElementById('dt-q').addEventListener('input', e => { dt.q = e.target.value.trim().toLowerCase(); drawTree(); });
document.getElementById('dt-meta').textContent = D.prev.ok
  ? `${D.start} ~ ${D.end} · 증감은 직전 기간(${D.prev.start} ~ ${D.prev.end}) 대비 · 이미지는 광고비 상위 소재까지`
  : `${D.start} ~ ${D.end} · 직전 기간 데이터가 없어 증감 없이 표시`;

// ── 소재 Summary: 모델이 guides/creative-summary.md를 따라 쓴 불릿. <strong>만 허용 ──
function rich(t) { return esc(t).replace(/&lt;(\/?)strong&gt;/g, '<$1strong>'); }
function drawSummary() {
  const items = D.summary || [];
  document.getElementById('summary-sec').style.display = items.length ? '' : 'none';
  document.getElementById('summary-meta').textContent = D.prev.ok ? `직전 기간(${D.prev.start} ~ ${D.prev.end}) 대비` : '';
  document.getElementById('summary').innerHTML = '<ul class="lh-bullets">' + items.map(it =>
    `<li class="lh-bullet tone-${['red', 'green', 'yellow'].includes(it.tone) ? it.tone : 'neutral'}"><span class="lh-dot"></span>
     <span class="lh-bullet-text">${it.head ? `<strong>${esc(it.head)}</strong> ` : ''}<span>${rich(it.text || '')}</span></span></li>`).join('') + '</ul>';
}

// ── 일별 추이: 전체(고른 매체 합) / 매체별 선, 지표 선택 ──
const TR = { view: 'total', metric: 0, chart: null };
const TRM = [['광고비', v => v[0], 'money'], ['노출', v => v[1], 'int'], ['클릭', v => v[2], 'int'],
  ['CTR', v => ratio(v[2], v[1], 100), 'ctr'], ['CPC', v => ratio(v[0], v[2]), 'money']]
  .concat(D.has.conversion ? [['전환', v => v[3], 'int']] : [])
  .concat(D.has.revenue ? [['ROAS', v => ratio(v[4], v[0], 100), 'pct']] : []);
const PALETTE = ['#3b82f6', '#f97316', '#10b981', '#a855f7', '#ef4444', '#14b8a6', '#eab308', '#64748b'];
function drawTrend() {
  const sec = document.getElementById('trend-sec');
  if (!D.trend || !window.Chart) { sec.style.display = 'none'; return; }
  const media = Object.keys(D.trend.media).filter(m => !st.hidden.has(m));
  const m = TRM[TR.metric];
  const sum = i => media.reduce((acc, k) => acc.map((x, j) => x + D.trend.media[k][i][j]), [0, 0, 0, 0, 0]);
  const series = TR.view === 'total'
    ? [{ name: '전체', color: '#3b82f6', vals: D.trend.dates.map((_, i) => m[1](sum(i))) }]
    : media.map(k => ({ name: k, color: PALETTE[Object.keys(D.trend.media).indexOf(k) % PALETTE.length],
        vals: D.trend.media[k].map(v => m[1](v)) }));
  document.getElementById('tr-view').innerHTML = [['total', '전체'], ['media', '매체별']].map(([k, l]) =>
    `<button data-v="${k}" class="${TR.view === k ? 'is-on' : ''}">${l}</button>`).join('');
  document.getElementById('tr-metric').innerHTML = TRM.map((x, i) =>
    `<button class="cr-chip${TR.metric === i ? ' is-on' : ''}" data-m="${i}">${x[0]}</button>`).join('');
  if (TR.chart) TR.chart.destroy();
  TR.chart = new Chart(document.getElementById('tr-cv'), {
    type: 'line',
    data: { labels: D.trend.dates.map(d => d.slice(5)),
      datasets: series.map(x => ({ label: x.name, data: x.vals, borderColor: x.color, backgroundColor: x.color,
        tension: 0.3, pointRadius: 2, borderWidth: 2, spanGaps: true })) },
    options: { responsive: true, maintainAspectRatio: false, animation: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { display: TR.view === 'media', position: 'bottom' },
        tooltip: { callbacks: { label: c => c.dataset.label + ': ' + f[m[2]](c.parsed.y) } } },
      scales: { x: { grid: { display: false } },
        y: { beginAtZero: true, grid: { color: '#f1f5f9' }, ticks: { callback: v => f[m[2] === 'money' ? 'big' : m[2]](v) } } } },
  });
}
document.getElementById('tr-view').addEventListener('click', e => {
  const b = e.target.closest('button[data-v]'); if (b) { TR.view = b.dataset.v; drawTrend(); }
});
document.getElementById('tr-metric').addEventListener('click', e => {
  const b = e.target.closest('button[data-m]'); if (b) { TR.metric = +b.dataset.m; drawTrend(); }
});

document.getElementById('title').textContent = D.brand + ' 소재 성과';
document.getElementById('period').textContent = `기간 ${D.start} ~ ${D.end}` +
  (D.sorts.some(s => s[0] === 'ctr') ? ` · CTR${D.has.revenue ? '·ROAS' : ''} TOP은 노출 1,000 이상·매체 광고비 1% 이상 소재만` : '');
document.addEventListener('click', e => {
  if (e.target.matches('.cr-th img')) {
    const z = document.getElementById('zoom');
    z.querySelector('img').src = e.target.src;
    z.classList.add('is-on');
  }
});
drawSummary();
draw();
</script>
</body>
</html>
