<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script>/*__CHART_JS__*/</script>
<style>
/* 소재 성과 — 주인공은 소재 이미지와 '매체 광고비 중 비중' 막대 하나. 나머지는 흰 종이 위의 조용한 글과 숫자. */
:root {
  --ink: #1c2230; --body: #4b5363; --muted: #8a92a1; --line: #e4e7ec; --wash: #f3f5f8;
  --spend: #2f4fd8; --spend-soft: #e3e8fb; --up: #d23b2f; --down: #2563d6; --good: #12805c; --warn: #b7791f;
  --font: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #fff; color: var(--body); font: 14.5px/1.6 var(--font); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, img:focus-visible { outline: 2px solid var(--spend); outline-offset: 2px; }
.page { max-width: 1180px; margin: 0 auto; padding: 40px 32px 64px; }
h1 { font-size: 26px; line-height: 1.3; font-weight: 700; color: var(--ink); letter-spacing: -0.01em; }
h2 { font-size: 18px; line-height: 1.4; font-weight: 700; color: var(--ink); }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.up { color: var(--up); } .down { color: var(--down); }

/* 머리말 */
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; }
.period { margin-top: 6px; color: var(--muted); }
.kpis { display: flex; flex-wrap: wrap; gap: 8px 36px; margin-top: 22px; }
.kpi dt { font-size: 12.5px; color: var(--muted); }
.kpi dd { font-size: 20px; font-weight: 650; color: var(--ink); line-height: 1.35; }
.kpi dd .chg { font-size: 12.5px; font-weight: 500; margin-left: 6px; }
.print { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer; color: var(--ink); white-space: nowrap; }
.print:hover { border-color: var(--muted); }

/* 조작 줄 — 화면 위에 붙는다 */
.bar { position: sticky; top: 0; z-index: 5; background: rgba(255,255,255,.96); backdrop-filter: blur(6px);
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 28px; padding: 14px 0; margin-top: 28px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.ctl { display: flex; align-items: center; gap: 10px; }
.ctl > span { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.ctl.right { margin-left: auto; }
.seg { display: inline-flex; background: var(--wash); border-radius: 8px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; border-radius: 6px; padding: 5px 12px; font-size: 13px; cursor: pointer; color: var(--body); }
.seg button:hover { color: var(--ink); }
.seg button.on { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(28,34,48,.12); }
.toggles { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.toggles button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; color: var(--muted); }
.toggles button.on { border-color: var(--ink); color: var(--ink); }
.toggles button.on::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--spend); margin-right: 6px; vertical-align: 2px; }

/* 섹션 */
section { margin-top: 48px; }
.sec-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.sec-head p { margin-top: 2px; }

/* 매체 */
.media + .media { margin-top: 40px; }
.media-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 22px; margin-bottom: 14px; }
.media-head h2 { font-size: 20px; }
.media-head .st { font-size: 13px; color: var(--muted); }
.media-head .st b { color: var(--ink); font-weight: 600; margin-left: 4px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
.card { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #fff; display: flex; flex-direction: column; }
.shot { position: relative; aspect-ratio: 4 / 3; overflow: hidden; background: var(--wash); display: flex; align-items: center; justify-content: center; }
.shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; cursor: zoom-in; }
.shot .none { font-size: 12.5px; color: var(--muted); text-align: center; line-height: 1.5; }
.shot .none b { display: block; font-size: 28px; font-weight: 700; color: #cfd4dc; line-height: 1.2; }
.rank { position: absolute; top: 10px; left: 10px; min-width: 26px; height: 26px; padding: 0 7px; border-radius: 13px; background: var(--ink); color: #fff;
  font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.card-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.cname { color: var(--ink); font-weight: 600; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cpath { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.share { display: flex; align-items: center; gap: 10px; }
.share .track { flex: 1; height: 6px; border-radius: 3px; background: var(--spend-soft); overflow: hidden; }
.share .fill { height: 100%; background: var(--spend); border-radius: 3px; }
.share span { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.share span b { color: var(--spend); font-weight: 650; }
.mx { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px 10px; margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line); }
.mx div { min-width: 0; }
.mx dt { font-size: 11.5px; color: var(--muted); }
.mx dd { font-size: 14px; color: var(--ink); font-weight: 500; white-space: nowrap; }
.mx .hl dd { color: var(--spend); font-weight: 700; }
.note { font-size: 12.5px; color: var(--muted); margin-top: 10px; }

/* 요약 */
.sum { list-style: none; max-width: 860px; }
.sum li { display: grid; grid-template-columns: 10px 1fr; gap: 0 14px; padding: 14px 0; border-top: 1px solid var(--line); }
.sum li:first-child { border-top: 0; padding-top: 2px; }
.sum .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 8px; background: #b8bec9; }
.sum .red .dot { background: var(--up); } .sum .green .dot { background: var(--good); } .sum .yellow .dot { background: var(--warn); }
.sum h3 { font-size: 14.5px; font-weight: 650; color: var(--ink); }
.sum p { margin-top: 2px; }
.sum strong { color: var(--ink); font-weight: 650; }

/* 추이 */
.chart { position: relative; height: 280px; }

/* 세부 표 — 웹 보고서 세부 표(기간 뷰)와 같은 구조 */
.tools { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.tools input { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 13px; width: 200px; }
.scroll { overflow: auto; max-height: 640px; border: 1px solid var(--line); border-radius: 10px; }
.dt { border-collapse: separate; border-spacing: 0; font-size: 13px; width: max-content; min-width: 100%; }
.dt th, .dt td { padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: #fff; }
.dt thead th { position: sticky; top: 0; z-index: 2; background: var(--wash); font-weight: 600; color: var(--body); text-align: left; font-size: 12.5px; }
.dt .num { text-align: right; min-width: 104px; }
.dt th.num { cursor: pointer; user-select: none; }
.dt th.num:hover { color: var(--ink); }
.dt th .ar { color: var(--muted); margin-left: 4px; font-size: 11px; }
.dt .lv { min-width: 140px; max-width: 220px; }
.dt .sticky { position: sticky; left: 0; z-index: 1; box-shadow: 1px 0 0 var(--line); }
.dt thead .sticky { z-index: 3; }
.dt tr.lv-0 td { font-weight: 600; color: var(--ink); }
.dt tr.lv-1 td { background: #fafbfc; }
.item { display: inline-flex; align-items: center; gap: 4px; max-width: 220px; }
.item .tx { overflow: hidden; text-overflow: ellipsis; }
.car { width: 16px; flex: none; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 10px; }
.all { color: var(--muted); }
.v { display: inline-flex; flex-direction: column; align-items: flex-end; line-height: 1.35; }
.d { font-size: 11.5px; color: var(--muted); }
.timg { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; cursor: zoom-in; display: block; margin: 0 auto; border: 1px solid var(--line); }

.foot { margin-top: 56px; font-size: 12.5px; color: var(--muted); }
.zoom { position: fixed; inset: 0; background: rgba(20,24,33,.82); display: none; align-items: center; justify-content: center; z-index: 20; cursor: zoom-out; padding: 32px; }
.zoom.on { display: flex; }
.zoom img { max-width: 100%; max-height: 100%; border-radius: 8px; background: #fff; }

@media (max-width: 640px) {
  .page { padding: 24px 16px 48px; }
  h1 { font-size: 22px; }
  .head { flex-direction: column; }
  .ctl.right { margin-left: 0; }
  .grid { grid-template-columns: 1fr; }
}
@media print {
  .bar, .print, .tools { display: none; }
  .scroll { max-height: none; overflow: visible; }
  .card { break-inside: avoid; }
}
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="head">
      <div>
        <h1 id="title"></h1>
        <p class="period" id="period"></p>
      </div>
      <button class="print" type="button" onclick="window.print()">PDF로 저장</button>
    </div>
    <dl class="kpis" id="kpis"></dl>
  </header>

  <div class="bar">
    <div class="ctl"><span>매체</span><div class="toggles" id="media-tg"></div></div>
    <div class="ctl right"><span>순위 기준</span><div class="seg" id="sort-seg"></div></div>
  </div>

  <section id="groups-sec" style="margin-top:32px"><div id="groups"></div></section>

  <section id="summary-sec">
    <div class="sec-head"><div><h2>요약</h2><p class="muted small" id="summary-meta"></p></div></div>
    <ul class="sum" id="summary"></ul>
  </section>

  <section id="trend-sec">
    <div class="sec-head">
      <div><h2>일별 추이</h2><p class="muted small">위에서 고른 매체만 보여 줍니다.</p></div>
      <div class="tools"><div class="seg" id="tr-view"></div><div class="seg" id="tr-metric"></div></div>
    </div>
    <div class="chart"><canvas id="tr-cv" aria-label="일별 추이 차트"></canvas></div>
  </section>

  <section id="detail">
    <div class="sec-head">
      <div><h2>세부 광고 성과</h2><p class="muted small" id="dt-meta"></p></div>
      <div class="tools">
        <input id="dt-q" type="search" placeholder="캠페인·광고 이름 검색" aria-label="세부 광고 성과 검색">
        <div class="ctl"><span>펼칠 단계</span><div class="seg" id="dt-depth"></div></div>
      </div>
    </div>
    <div class="scroll"><table class="dt" id="dt"></table></div>
  </section>

  <p class="foot">by LaightAI</p>
</div>
<div class="zoom" id="zoom" role="dialog" aria-label="소재 크게 보기"><img alt=""></div>

<script>
const D = "__DATA__";
const cur = D.currency;
const st = { sort: D.sort, hidden: new Set() };
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fin = v => (v == null || !isFinite(v)) ? null : v;
const f = {
  int: v => (v = fin(v)) == null ? '—' : Math.round(v).toLocaleString('ko-KR'),
  money: v => (v = fin(v)) == null ? '—' : cur + Math.round(v).toLocaleString('ko-KR'),
  short: v => (v = fin(v)) == null ? '—' : Math.abs(v) >= 1e6 ? cur + (v / 1e6).toFixed(1) + 'M' : Math.abs(v) >= 1e4 ? cur + Math.round(v / 1e3) + 'K' : cur + Math.round(v).toLocaleString('ko-KR'),
  ctr: v => (v = fin(v)) == null ? '—' : v.toFixed(2) + '%',
  pct: v => (v = fin(v)) == null ? '—' : v.toFixed(1) + '%',
};
const ratio = (a, b, k = 1) => b ? a / b * k : null;
const dots = d => d.replace(/-/g, '.');

// 원자 지표 [광고비, 노출, 클릭, 전환, 매출] → 지표
const METRICS = [
  { k: 'cost', l: '광고비', v: a => a[0], fm: 'money', pp: 0 },
  { k: 'impression', l: '노출', v: a => a[1], fm: 'int', pp: 0 },
  { k: 'click', l: '클릭', v: a => a[2], fm: 'int', pp: 0 },
  { k: 'ctr', l: 'CTR', v: a => ratio(a[2], a[1], 100), fm: 'ctr', pp: 1 },
  { k: 'cpc', l: 'CPC', v: a => ratio(a[0], a[2]), fm: 'money', pp: 0 },
].concat(D.has.conversion ? [{ k: 'conversion', l: '전환', v: a => a[3], fm: 'int', pp: 0 },
                             { k: 'cvr', l: 'CVR', v: a => ratio(a[3], a[2], 100), fm: 'pct', pp: 1 }] : [])
 .concat(D.has.revenue ? [{ k: 'roas', l: 'ROAS', v: a => ratio(a[4], a[0], 100), fm: 'pct', pp: 1 }] : []);

// 직전 기간 대비. 비율 지표는 %p, 나머지는 변화율. 직전 값이 0·없으면 null
function delta(a, b, m) {
  if (!D.prev.ok || !b) return null;
  const x = fin(m.v(b)), y = fin(m.v(a));
  if (x == null || y == null) return null;
  if (m.pp) return { n: y - x, t: Math.abs(y - x).toFixed(1) + '%p' };
  if (!x) return null;
  const n = (y - x) / Math.abs(x) * 100;
  return { n, t: Math.abs(n).toFixed(1) + '%' };
}
function chg(a, b, m) {
  const d = delta(a, b, m);
  if (!d) return '<span class="d">—</span>';
  const r = Math.round(d.n * 10) / 10;
  return `<span class="d ${r > 0 ? 'up' : r < 0 ? 'down' : ''}">${r > 0 ? '▲ ' : r < 0 ? '▼ ' : ''}${d.t}</span>`;
}
const sumNodes = (ns, key) => ns.reduce((acc, n) => n[key] ? acc.map((x, i) => x + n[key][i]) : acc, [0, 0, 0, 0, 0]);

// ── 머리말 ──
$('title').textContent = D.brand + ' 소재 성과';
$('period').textContent = `${dots(D.start)} – ${dots(D.end)}` + (D.prev.ok ? `, 직전 ${dots(D.prev.start)} – ${dots(D.prev.end)} 대비` : '');
function drawKpis() {
  const roots = D.tree.filter(n => !st.hidden.has(n.n));
  const pm = D.prev_media || {};
  const c = sumNodes(roots, 'c');
  const p = D.prev.ok ? Object.keys(pm).filter(k => !st.hidden.has(k)).reduce((acc, k) => acc.map((x, i) => x + pm[k][i]), [0, 0, 0, 0, 0]) : null;
  const keys = ['cost', 'click', 'ctr'].concat(D.has.conversion ? ['conversion'] : []).concat(D.has.revenue ? ['roas'] : ['cpc']);
  $('kpis').innerHTML = keys.map(k => {
    const m = METRICS.find(x => x.k === k);
    return `<div class="kpi"><dt>${m.l}</dt><dd>${f[m.fm](m.v(c))}${p ? chg(c, p, m).replace('class="d', 'class="chg') : ''}</dd></div>`;
  }).join('');
}

// ── 조작 줄 ──
function drawBar() {
  $('media-tg').innerHTML = D.media.map(g => {
    const n = g.summary.media, on = !st.hidden.has(n);
    return `<button type="button" class="${on ? 'on' : ''}" aria-pressed="${on}" data-m="${esc(n)}">${esc(n)}</button>`;
  }).join('');
  $('sort-seg').innerHTML = D.sorts.map(([k, l]) =>
    `<button type="button" class="${st.sort === k ? 'on' : ''}" aria-pressed="${st.sort === k}" data-s="${k}">${l}</button>`).join('');
}
$('media-tg').addEventListener('click', e => {
  const b = e.target.closest('button[data-m]'); if (!b) return;
  const n = b.dataset.m; st.hidden.has(n) ? st.hidden.delete(n) : st.hidden.add(n); draw();
});
$('sort-seg').addEventListener('click', e => {
  const b = e.target.closest('button[data-s]'); if (b) { st.sort = b.dataset.s; draw(); }
});

// ── 매체별 소재 TOP ──
function rank(rows, sort) {
  let pool = rows, fallback = false;
  if (sort === 'ctr' || sort === 'roas') {
    const total = rows.reduce((a, r) => a + r.cost, 0);
    pool = rows.filter(r => r.impression >= D.min.impression && r.cost >= total * D.min.share);
    if (!pool.length) { pool = rows; fallback = true; }
    pool = pool.filter(r => r[sort] != null);
  }
  pool = pool.slice().sort((a, b) => (b[sort] || 0) - (a[sort] || 0) || b.cost - a.cost);
  return { top: pool.slice(0, D.top), fallback };
}
const CARD_MX = [['cost', '광고비', 'money'], ['ctr', 'CTR', 'ctr'], ['cpc', 'CPC', 'money'], ['click', '클릭', 'int']]
  .concat(D.has.conversion ? [['conversion', '전환', 'int']] : [['impression', '노출', 'int']])
  .concat(D.has.revenue ? [['roas', 'ROAS', 'pct']] : D.has.conversion ? [['cvr', 'CVR', 'pct']] : []);
function card(x, i, mediaCost, mediaName) {
  const share = mediaCost ? x.cost / mediaCost * 100 : 0;
  const path = [x.campaign_name, x.ad_group_name].filter(p => p && p !== x.name);
  const initial = esc((mediaName || '?').trim().charAt(0));
  return `<article class="card">
    <div class="shot">${x.thumb ? `<img src="${x.thumb}" alt="${esc(x.name)}" tabindex="0">` : `<div class="none"><b>${initial}</b>이미지 없음</div>`}
      <span class="rank">${i + 1}</span></div>
    <div class="card-body">
      <div><div class="cname" title="${esc(x.name)}">${esc(x.name)}</div>
        ${path.length ? `<div class="cpath" title="${esc(path.join(' › '))}">${esc(path.join(' › '))}</div>` : ''}</div>
      <div class="share" title="매체 광고비 중 이 소재의 비중"><div class="track"><div class="fill" style="width:${Math.min(100, share).toFixed(1)}%"></div></div>
        <span>매체 광고비의 <b>${share.toFixed(1)}%</b></span></div>
      <dl class="mx">${CARD_MX.map(([k, l, fm]) => `<div class="${k === st.sort ? 'hl' : ''}"><dt>${l}</dt><dd>${f[fm](x[k])}</dd></div>`).join('')}</dl>
    </div></article>`;
}
function drawGroups() {
  const label = (D.sorts.find(s => s[0] === st.sort) || ['', ''])[1];
  const html = D.media.filter(g => !st.hidden.has(g.summary.media)).map(g => {
    const m = g.summary, r = rank(g.rows, st.sort);
    const tail = D.has.revenue ? `<span class="st">ROAS<b>${f.pct(m.roas)}</b></span>` : `<span class="st">CPC<b>${f.money(m.cpc)}</b></span>`;
    return `<div class="media">
      <div class="media-head"><h2>${esc(m.media)}</h2>
        <span class="st">광고비<b>${f.money(m.cost)}</b></span><span class="st">CTR<b>${f.ctr(m.ctr)}</b></span>${tail}
        <span class="st">소재<b>${m.creatives}개</b></span></div>
      <div class="grid">${r.top.map((x, i) => card(x, i, m.cost, m.media)).join('')}</div>
      ${r.fallback ? '<p class="note">노출 1,000 이상이면서 매체 광고비의 1% 이상인 소재가 없어, 전체 소재로 순위를 매겼습니다.</p>' : ''}
      ${(st.sort === 'ctr' || st.sort === 'roas') && !r.fallback ? `<p class="note">${label} 순위는 노출 1,000 이상이면서 매체 광고비의 1% 이상인 소재만 비교합니다.</p>` : ''}
    </div>`;
  }).join('');
  $('groups').innerHTML = html || '<p class="muted">위에서 매체를 하나 이상 고르세요.</p>';
}

// ── 요약: 모델이 guides/creative-summary.md를 따라 쓴 불릿. <strong>만 허용 ──
(function drawSummary() {
  const items = D.summary || [];
  if (!items.length) { $('summary-sec').style.display = 'none'; return; }
  $('summary-meta').textContent = D.prev.ok ? `직전 기간(${dots(D.prev.start)} – ${dots(D.prev.end)})과 비교했습니다.` : '';
  const rich = t => esc(t).replace(/&lt;(\/?)strong&gt;/g, '<$1strong>');
  $('summary').innerHTML = items.map(it =>
    `<li class="${['red', 'green', 'yellow'].includes(it.tone) ? it.tone : ''}"><span class="dot"></span>
      <div>${it.head ? `<h3>${esc(it.head)}</h3>` : ''}<p>${rich(it.text || '')}</p></div></li>`).join('');
})();

// ── 일별 추이 ──
const TR = { view: 'total', metric: 'cost', chart: null };
const TRM = METRICS.filter(m => m.k !== 'cvr');
const PALETTE = ['#2f4fd8', '#e0742b', '#12805c', '#8b4fd8', '#c23b6f', '#1b8a9a', '#a07a12', '#5b6474'];
function drawTrend() {
  if (!D.trend || !window.Chart) { $('trend-sec').style.display = 'none'; return; }
  const names = Object.keys(D.trend.media), media = names.filter(n => !st.hidden.has(n));
  const m = TRM.find(x => x.k === TR.metric);
  const at = i => media.reduce((acc, k) => acc.map((x, j) => x + D.trend.media[k][i][j]), [0, 0, 0, 0, 0]);
  const series = TR.view === 'total'
    ? [{ name: '선택한 매체 합계', color: PALETTE[0], vals: D.trend.dates.map((_, i) => fin(m.v(at(i)))) }]
    : media.map(k => ({ name: k, color: PALETTE[names.indexOf(k) % PALETTE.length], vals: D.trend.media[k].map(v => fin(m.v(v))) }));
  $('tr-view').innerHTML = [['total', '합계'], ['media', '매체별']].map(([k, l]) =>
    `<button type="button" class="${TR.view === k ? 'on' : ''}" aria-pressed="${TR.view === k}" data-v="${k}">${l}</button>`).join('');
  $('tr-metric').innerHTML = TRM.map(x =>
    `<button type="button" class="${TR.metric === x.k ? 'on' : ''}" aria-pressed="${TR.metric === x.k}" data-k="${x.k}">${x.l}</button>`).join('');
  if (TR.chart) TR.chart.destroy();
  const tick = v => m.fm === 'money' ? f.short(v) : m.fm === 'int' ? (v >= 1e4 ? Math.round(v / 1e3) + 'K' : f.int(v)) : f[m.fm](v);
  TR.chart = new Chart($('tr-cv'), {
    type: 'line',
    data: { labels: D.trend.dates.map(d => d.slice(5).replace('-', '.')),
      datasets: series.map(x => ({ label: x.name, data: x.vals, borderColor: x.color, backgroundColor: x.color,
        tension: 0.25, pointRadius: 0, pointHoverRadius: 4, borderWidth: 2, spanGaps: true })) },
    options: { responsive: true, maintainAspectRatio: false, animation: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { display: TR.view === 'media', position: 'top', align: 'end', labels: { boxWidth: 10, boxHeight: 10, font: { family: 'Pretendard Variable, Malgun Gothic' } } },
        tooltip: { callbacks: { label: c => ` ${c.dataset.label}  ${f[m.fm](c.parsed.y)}` } } },
      scales: { x: { grid: { display: false }, ticks: { color: '#8a92a1', maxRotation: 0, autoSkip: true, maxTicksLimit: 10 } },
        y: { beginAtZero: true, border: { display: false }, grid: { color: '#eef0f3' }, ticks: { color: '#8a92a1', maxTicksLimit: 5, callback: tick } } } },
  });
}
$('tr-view').addEventListener('click', e => { const b = e.target.closest('button[data-v]'); if (b) { TR.view = b.dataset.v; drawTrend(); } });
$('tr-metric').addEventListener('click', e => { const b = e.target.closest('button[data-k]'); if (b) { TR.metric = b.dataset.k; drawTrend(); } });

// ── 세부 광고 성과: 웹 보고서 세부 표(기간 뷰)와 같은 규칙 ──
//  단계마다 열, 하위가 있는 줄은 다음 단계 칸에 '전체', 이미지 열은 이번 기간 소재 썸네일만, 직전 0·없음은 '—'
const LV = ['매체', '캠페인', '광고그룹', '광고'];
(function collapse(ns) {   // 하위가 같은 이름의 소재 하나뿐인 줄은 한 줄로
  ns.forEach(n => { collapse(n.k); if (n.k.length === 1 && !n.k[0].k.length && n.k[0].n === n.n) { n.t = n.k[0].t; n.k = []; } });
})(D.tree);
let uid = 0;
(function tag(ns, d) { ns.forEach(n => { n.id = ++uid; n.d = d; tag(n.k, d + 1); }); })(D.tree, 0);
const dt = { open: new Set(), depth: 0, sort: null, q: '' };
const hasImg = ns => ns.some(n => n.t || hasImg(n.k));
const maxLv = ns => ns.reduce((a, n) => Math.max(a, n.d, maxLv(n.k)), 0);
const matches = n => n.n.toLowerCase().includes(dt.q) || n.k.some(matches);
function sorted(ns) {
  if (!dt.sort) return ns;
  const m = METRICS[dt.sort.i], s = dt.sort.dir === 'asc' ? 1 : -1, val = n => fin(m.v(n.c)) ?? -Infinity;
  return ns.slice().sort((a, b) => (val(a) - val(b)) * s);
}
function drawTree() {
  const roots = D.tree.filter(n => !st.hidden.has(n.n));
  const img = hasImg(roots), levels = LV.slice(0, maxLv(roots) + 1);
  const head = '<thead><tr>' + levels.map((l, i) => `<th class="lv${i ? '' : ' sticky'}">${l}</th>`).join('')
    + (img ? '<th style="text-align:center">이미지</th>' : '')
    + METRICS.map((m, i) => `<th class="num" data-i="${i}" aria-sort="${dt.sort && dt.sort.i === i ? (dt.sort.dir === 'asc' ? 'ascending' : 'descending') : 'none'}">${m.l}<span class="ar">${dt.sort && dt.sort.i === i ? (dt.sort.dir === 'asc' ? '▲' : '▼') : '↕'}</span></th>`).join('')
    + '</tr></thead>';
  const out = [];
  (function walk(ns) {
    sorted(ns).forEach(n => {
      if (dt.q && !matches(n)) return;
      const kids = n.k.length > 0, open = dt.q ? true : dt.open.has(n.id);
      const cells = levels.map((_, lv) => {
        let s = '';
        if (n.d === lv) s = `<span class="item">${kids ? `<button type="button" class="car" data-id="${n.id}" aria-expanded="${open}" aria-label="${open ? '접기' : '펼치기'}">${open ? '▼' : '▶'}</button>` : '<span class="car"></span>'}<span class="tx" title="${esc(n.n)}">${esc(n.n)}</span></span>`;
        else if (n.d + 1 === lv && kids) s = '<span class="all">전체</span>';
        return `<td class="lv${lv ? '' : ' sticky'}">${s}</td>`;
      }).join('');
      out.push(`<tr class="lv-${n.d}">${cells}` + (img ? `<td>${n.t ? `<img class="timg" src="${n.t}" alt="${esc(n.n)}" tabindex="0">` : ''}</td>` : '')
        + METRICS.map(m => `<td class="num"><span class="v"><span>${f[m.fm](m.v(n.c))}</span>${chg(n.c, n.p, m)}</span></td>`).join('') + '</tr>');
      if (kids && open) walk(n.k);
    });
  })(roots);
  $('dt').innerHTML = head + '<tbody>' + (out.join('') || `<tr><td colspan="${levels.length + METRICS.length + 1}" class="muted">검색어와 맞는 캠페인·광고가 없습니다.</td></tr>`) + '</tbody>';
  $('dt-depth').innerHTML = LV.slice(1, levels.length).map((l, i) =>
    `<button type="button" class="${dt.depth === i + 1 ? 'on' : ''}" aria-pressed="${dt.depth === i + 1}" data-d="${i + 1}">${l}</button>`).join('');
}
$('dt').addEventListener('click', e => {
  const c = e.target.closest('.car[data-id]');
  if (c) { const id = +c.dataset.id; dt.open.has(id) ? dt.open.delete(id) : dt.open.add(id); return drawTree(); }
  const th = e.target.closest('th.num');
  if (th) {   // 내림 → 오름 → 해제
    const i = +th.dataset.i;
    dt.sort = !dt.sort || dt.sort.i !== i ? { i, dir: 'desc' } : dt.sort.dir === 'desc' ? { i, dir: 'asc' } : null;
    drawTree();
  }
});
$('dt-depth').addEventListener('click', e => {
  const b = e.target.closest('button[data-d]'); if (!b) return;
  const d = +b.dataset.d;
  dt.depth = dt.depth === d ? 0 : d;   // 그 단계까지 펼친다, 다시 누르면 접기
  dt.open.clear();
  (function op(ns) { ns.forEach(n => { if (n.d < dt.depth && n.k.length) { dt.open.add(n.id); op(n.k); } }); })(D.tree);
  drawTree();
});
$('dt-q').addEventListener('input', e => { dt.q = e.target.value.trim().toLowerCase(); drawTree(); });
$('dt-meta').textContent = D.prev.ok
  ? '값 아래는 직전 기간 대비 증감입니다. 비율 지표는 %p, 직전 값이 없으면 —로 표시합니다.'
  : '직전 기간 데이터가 없어 증감 없이 표시합니다.';

// ── 이미지 크게 보기 ──
const zoom = $('zoom');
function openZoom(src, alt) { zoom.querySelector('img').src = src; zoom.querySelector('img').alt = alt || ''; zoom.classList.add('on'); }
document.addEventListener('click', e => {
  if (e.target.matches('.shot img, .timg')) openZoom(e.target.src, e.target.alt);
  else if (e.target.closest('#zoom')) zoom.classList.remove('on');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') zoom.classList.remove('on');
  if (e.key === 'Enter' && e.target.matches('.shot img, .timg')) openZoom(e.target.src, e.target.alt);
});

function draw() { drawBar(); drawKpis(); drawGroups(); drawTrend(); drawTree(); }
draw();
</script>
</body>
</html>
