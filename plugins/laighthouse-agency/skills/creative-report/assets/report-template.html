<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<script>/*__CHART_JS__*/</script>
<style>
/*__KIT_CSS__*/
/* ---------------------------------------------------------------------
   소재 성과 — 다른 agency 보고서(Daily·Weekly·Monthly)와 같은 공용 킷(report_kit.css) 위에 그린다:
   섹션 카드 · 머리말 · KPI 격자 · 알약 탭 · 요약 불릿 · 범례 · 표. 아래는 킷에 없는 소재 전용 부품만.
   --------------------------------------------------------------------- */
.lh-page { max-width: 1040px; }
.lh-kpis.cr-k5 { grid-template-columns: repeat(5, 1fr); }
.lh-kpi-value { font-size: 24px; }
.cr-ctl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cr-ctl > .lh-muted { font-size: 12px; margin-right: 2px; }
.cr-new { display: inline-block; font-size: 10.5px; font-weight: 600; color: #1d4ed8; background: #eff6ff; border-radius: 4px; padding: 1px 5px; }
.lh-tab .lh-mdot { margin-right: 5px; }
.lh-tab.is-off { color: var(--muted); border-style: dashed; }
.lh-tab.is-off .lh-mdot { opacity: .35; }

/* 매체 묶음 */
.cr-media { border-top: 1px solid var(--line-soft); padding-top: 16px; }
.cr-media:first-child { border-top: 0; padding-top: 0; }
.cr-media + .cr-media { margin-top: 16px; }
.cr-media-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 16px; margin-bottom: 12px; }
.cr-media-head .nm { font-size: 14px; font-weight: 700; color: var(--ink); }
.cr-media-head .st { font-size: 12px; color: var(--label); }
.cr-media-head .st b { color: var(--ink); font-weight: 600; margin-left: 3px; }
.cr-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }

/* 소재 카드 */
.cr-card { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; display: flex; flex-direction: column; }
.cr-shot { position: relative; aspect-ratio: 4 / 3; overflow: hidden; background: var(--sub-bg); border-bottom: 1px solid var(--line); }
.cr-shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; cursor: zoom-in; }
.cr-badges { display: flex; gap: 4px; align-items: center; }
.cr-shot .cr-badges { position: absolute; top: 8px; left: 8px; }
.cr-rank { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px;
  background: var(--ink); color: #fff; font-size: 12px; font-weight: 700; }
.cr-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.cr-name { font-size: 13px; font-weight: 600; color: var(--ink); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cr-path { font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cr-share { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; }
.cr-share .lh-bar { margin: 0; }
.cr-share span { font-size: 11px; color: var(--label); white-space: nowrap; }
.cr-share b { color: var(--ink); }
.cr-mx { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 6px; margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line-soft); }
.cr-mx dt { font-size: 11px; color: var(--label); }
.cr-mx dd { display: flex; flex-direction: column; font-size: 13px; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.cr-mx .hl { background: #eff6ff; border-radius: 4px; margin: -3px -5px; padding: 3px 5px; }
.cr-mx .hl dt { color: var(--ink); font-weight: 600; }
.cr-mx .hl dd > span:first-child { font-weight: 700; }

/* 세부 표 — 웹 보고서 세부 표(단계별 열·'전체')를 킷 표 스타일로 */
.cr-tree-wrap { max-height: 640px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
.cr-tree { width: max-content; min-width: 100%; border-collapse: separate; border-spacing: 0; }
.cr-tree th { position: sticky; top: 0; z-index: 2; }
.cr-tree th.lv, .cr-tree td.lv { text-align: left; min-width: 110px; max-width: 170px; }
.cr-tree th.lv.sticky, .cr-tree td.lv.sticky { min-width: 150px; max-width: 200px; }
.cr-tree th.num, .cr-tree td.num { text-align: right; min-width: 92px; }
.cr-tree th.sortable { cursor: pointer; user-select: none; }
.cr-tree th.sortable:hover { background: var(--line); }
.cr-tree th .sort { color: var(--muted); margin-left: 3px; font-size: 10px; }
.cr-tree th.sorted .sort { color: var(--ink); }
.cr-tree .sticky { position: sticky; left: 0; z-index: 1; background: #fff; box-shadow: 1px 0 0 var(--line); }
.cr-tree thead .sticky { z-index: 3; background: var(--head-bg); }
.cr-tree tr.lv-0 td { font-weight: 600; color: var(--ink); background: var(--sub-bg); }
.cr-tree .item { display: inline-flex; align-items: center; gap: 2px; max-width: 100%; }
.cr-tree .item .tx { overflow: hidden; text-overflow: ellipsis; }
.cr-tree .all { color: var(--muted); font-weight: 400; }
.cr-tree .vc { display: inline-flex; flex-direction: column; align-items: flex-end; line-height: 1.35; }
.cr-thumb { width: 36px; height: 28px; object-fit: cover; border-radius: 4px; cursor: zoom-in; vertical-align: middle; border: 1px solid var(--line); }
.lh-caret.ph { visibility: hidden; }

.cr-zoom { position: fixed; inset: 0; background: rgba(15, 23, 42, .8); display: none; align-items: center; justify-content: center; z-index: 50; cursor: zoom-out; padding: 32px; }
.cr-zoom.on { display: flex; }
.cr-zoom img { max-width: 100%; max-height: 100%; border-radius: 8px; background: #fff; }
.print-only { display: none; }

@media (max-width: 860px) { .cr-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .lh-kpis.cr-k5 { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 560px) { .cr-grid { grid-template-columns: 1fr; } .lh-kpis.cr-k5 { grid-template-columns: repeat(2, 1fr); } }
@page { size: A4 landscape; margin: 10mm; }
@media print {
  body { padding: 0; background: #fff; }
  .lh-print, .no-print { display: none !important; }
  .print-only { display: block; }
  .lh-page { max-width: none; }
  .lh-section, .cr-card, .lh-bullet { break-inside: avoid; }
  .cr-tree-wrap { max-height: none; overflow: visible; border: 0; }
  .cr-tree { table-layout: fixed; width: 100%; min-width: 0; font-size: 9.5px; }
  .cr-tree th, .cr-tree td { position: static; padding: 4px 5px; white-space: normal; word-break: break-all; }
  .cr-tree th.lv, .cr-tree td.lv, .cr-tree th.num, .cr-tree td.num { min-width: 0; max-width: none; }
  .cr-tree .item { display: inline; } .cr-tree .lh-caret { display: none; }
  .cr-tree .lh-delta { font-size: 8.5px; }
  .cr-thumb { width: 28px; height: 22px; }
}
</style>
</head>
<body>
<div class="lh-page">
  <header class="lh-header">
    <div>
      <h1 id="title"></h1>
      <div class="lh-meta" id="period"></div>
      <div class="lh-meta print-only" id="print-state"></div>
    </div>
    <button class="lh-print" type="button" onclick="window.print()">PDF 저장</button>
  </header>

  <section class="lh-section">
    <div class="lh-section-head"><div><h2>기간 성과 요약</h2><p class="lh-desc" id="kpi-desc"></p></div></div>
    <div class="lh-kpis cr-k5" id="kpis"></div>
  </section>

  <section class="lh-section">
    <div class="lh-section-head">
      <div><h2>매체별 상위 소재</h2><p class="lh-desc" id="top-desc"></p></div>
    </div>
    <div class="lh-toolbar no-print">
      <div class="cr-ctl"><span class="lh-muted">매체</span><span class="cr-ctl" id="media-tabs"></span></div>
      <div class="cr-ctl"><span class="lh-muted">순위 기준</span><span class="lh-tabs" id="sort-tabs"></span></div>
    </div>
    <div id="groups"></div>
  </section>

  <section class="lh-section" id="summary-sec">
    <div class="lh-section-head"><div><h2>소재 Summary</h2><p class="lh-desc" id="summary-meta"></p></div></div>
    <div id="summary"></div>
  </section>

  <section class="lh-section" id="trend-sec">
    <div class="lh-section-head"><div><h2>매체별 일별 추이</h2><p class="lh-desc">아래 매체 이름을 누르면 그래프에서 숨기거나 다시 보여 줍니다.</p></div></div>
    <div class="lh-toolbar">
      <span class="lh-tabs" id="tr-metric"></span>
      <span class="lh-tabs" id="tr-view"></span>
    </div>
    <div class="lh-legend" id="tr-legend"></div>
    <div class="lh-chart"><canvas id="tr-cv" aria-label="일별 추이 그래프"></canvas></div>
  </section>

  <section class="lh-section">
    <div class="lh-section-head"><div><h2>세부 광고 성과</h2><p class="lh-desc" id="dt-meta"></p></div></div>
    <div class="lh-toolbar no-print">
      <input id="dt-q" class="lh-search" type="search" placeholder="캠페인·광고 이름 검색" aria-label="세부 광고 성과 검색">
      <div class="cr-ctl"><span class="lh-muted">펼칠 단계</span><span class="lh-tabs" id="dt-depth"></span></div>
    </div>
    <div class="cr-tree-wrap"><table class="lh-table cr-tree" id="dt"></table></div>
  </section>

  <div class="lh-footer">— by LaightAI</div>
</div>
<div class="cr-zoom" id="zoom" role="dialog" aria-label="소재 크게 보기"><img alt=""></div>

<script>
const D = "__DATA__";
const cur = D.currency;
const ALL_MEDIA = D.media.map(g => g.summary.media);
const SERIES_COLORS = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#4a3aa7', '#e34948'];   // report_kit.py와 같은 순서
const colorOf = m => SERIES_COLORS[Math.max(0, ALL_MEDIA.indexOf(m)) % SERIES_COLORS.length];
const st = { sort: D.sort, hidden: new Set() };
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fin = v => (v == null || !isFinite(v)) ? null : v;
const f = {
  int: v => (v = fin(v)) == null ? '—' : Math.round(v).toLocaleString('ko-KR'),
  money: v => (v = fin(v)) == null ? '—' : cur + Math.round(v).toLocaleString('ko-KR'),
  short: v => (v = fin(v)) == null ? '—' : Math.abs(v) >= 1e6 ? cur + (v / 1e6).toFixed(1) + 'M' : Math.abs(v) >= 1e4 ? cur + Math.round(v / 1e3) + 'K' : cur + Math.round(v).toLocaleString('ko-KR'),
  pct: v => (v = fin(v)) == null ? '—' : v.toFixed(2) + '%',
};
const ratio = (a, b, k = 1) => b ? a / b * k : null;
const dots = d => d.replace(/-/g, '.');
const ZERO = [0, 0, 0, 0, 0];
const add = (a, b) => a.map((x, i) => x + (b ? b[i] : 0));
const mdot = m => `<span class="lh-mdot" style="--c:${colorOf(m)}"></span>`;

// 원자 지표 [광고비, 노출, 클릭, 전환, 매출] → 지표
const METRICS = [
  { k: 'cost', l: '광고비', v: a => a[0], fm: 'money' },
  { k: 'impression', l: '노출', v: a => a[1], fm: 'int' },
  { k: 'click', l: '클릭', v: a => a[2], fm: 'int' },
  { k: 'ctr', l: 'CTR', v: a => ratio(a[2], a[1], 100), fm: 'pct', pp: 1 },
  { k: 'cpc', l: 'CPC', v: a => ratio(a[0], a[2]), fm: 'money' },
].concat(D.has.conversion ? [{ k: 'conversion', l: '전환', v: a => a[3], fm: 'int' },
                             { k: 'cvr', l: 'CVR', v: a => ratio(a[3], a[2], 100), fm: 'pct', pp: 1 }] : [])
 .concat(D.has.revenue ? [{ k: 'roas', l: 'ROAS', v: a => ratio(a[4], a[0], 100), fm: 'pct', pp: 1 }] : []);
const M = k => METRICS.find(m => m.k === k);

// 직전 기간 대비: 비율 지표는 %p 차, 나머지는 변화율, 직전 값이 0·없으면 '—'. 증가 빨강 ▲ · 감소 파랑 ▼(다른 보고서와 같음)
function change(a, b, m) {
  if (!D.prev.ok || !a || !b) return null;
  const x = fin(m.v(b)), y = fin(m.v(a));
  if (x == null || y == null || (!m.pp && !x)) return null;
  const n = m.pp ? y - x : (y - x) / Math.abs(x) * 100, r = Math.round(n * 10) / 10;
  return { r, cls: r > 0 ? 'up' : r < 0 ? 'down' : 'flat', t: `${r > 0 ? '▲ +' : r < 0 ? '▼ ' : ''}${r.toFixed(1)}${m.pp ? '%p' : '%'}` };
}
const deltaHtml = (a, b, m) => { const c = change(a, b, m); return c ? `<span class="lh-delta ${c.cls}">${c.t}</span>` : '<span class="lh-delta lh-muted">—</span>'; };
const atoms = x => [x.cost, x.impression, x.click, x.conversion, x.revenue];
const visible = () => ALL_MEDIA.filter(m => !st.hidden.has(m));

// ── 머리말 ──
$('title').textContent = D.brand + ' 소재 성과 보고서';
$('period').textContent = `기간: ${dots(D.start)} ~ ${dots(D.end)}` + (D.prev.ok ? ` · 비교: 직전 기간 ${dots(D.prev.start)} ~ ${dots(D.prev.end)}` : '');

// ── 기간 성과 요약(KPI 격자) ──
function drawKpis() {
  const vis = new Set(visible());
  const c = D.tree.filter(n => vis.has(n.n)).reduce((acc, n) => add(acc, n.c), ZERO);
  const p = D.prev.ok ? Object.keys(D.prev_media || {}).filter(k => vis.has(k)).reduce((acc, k) => add(acc, D.prev_media[k]), ZERO) : null;
  const keys = ['cost', 'impression', 'click', 'ctr'].concat(D.has.revenue ? ['roas'] : D.has.conversion ? ['conversion'] : ['cpc']);
  $('kpi-desc').textContent = `${visible().join(' + ') || '선택한 매체 없음'} 합산, ${dots(D.start)} ~ ${dots(D.end)}`;
  $('kpis').innerHTML = keys.map(k => {
    const m = M(k), ch = p ? change(c, p, m) : null;
    return `<div class="lh-kpi"><div class="lh-kpi-label">${m.l}</div><div class="lh-kpi-value">${f[m.fm](m.v(c))}</div>
      ${p ? `<div class="lh-kpi-delta ${ch ? ch.cls : ''}">직전 기간 대비 ${ch ? ch.t : '—'}</div><div class="lh-kpi-sub">직전 기간 ${f[m.fm](m.v(p))}</div>` : ''}</div>`;
  }).join('');
  const label = (D.sorts.find(s => s[0] === st.sort) || ['', ''])[1];
  $('print-state').textContent = `매체: ${visible().join(', ') || '없음'} · 순위 기준: ${label}`;
}

// ── 매체 선택(이번 기간에 집행한 매체) · 순위 기준 ──
function drawControls() {
  const tab = n => {
    const on = !st.hidden.has(n);
    return `<button type="button" class="lh-tab${on ? '' : ' is-off'}" aria-pressed="${on}" data-m="${esc(n)}">${mdot(n)}${esc(n)}</button>`;
  };
  $('media-tabs').innerHTML = `<span class="lh-tabs">${D.media.map(g => tab(g.summary.media)).join('')}</span>`;
  $('sort-tabs').innerHTML = D.sorts.map(([k, l]) => `<button type="button" class="lh-tab${st.sort === k ? ' is-on' : ''}" aria-pressed="${st.sort === k}" data-s="${k}">${l}</button>`).join('');
}
$('media-tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-m]'); if (!b) return;
  const n = b.dataset.m; st.hidden.has(n) ? st.hidden.delete(n) : st.hidden.add(n); draw();
});
$('sort-tabs').addEventListener('click', e => { const b = e.target.closest('button[data-s]'); if (b) { st.sort = b.dataset.s; draw(); } });

// ── 매체별 상위 소재 ──
$('top-desc').textContent = `매체마다 순위 기준으로 상위 ${D.top}개 소재를 보여 줍니다. CTR·ROAS 순위는 노출 ${D.min.impression.toLocaleString('ko-KR')} 이상이면서 매체 광고비의 ${D.min.share * 100}% 이상을 쓴 소재끼리만 매깁니다.`;
function rank(rows, sort) {
  let pool = rows, fallback = false;
  if (sort === 'ctr' || sort === 'roas') {
    const total = rows.reduce((a, r) => a + r.cost, 0);
    pool = rows.filter(r => r.impression >= D.min.impression && r.cost >= total * D.min.share);
    if (!pool.length) { pool = rows; fallback = true; }
    pool = pool.filter(r => r[sort] != null);
  }
  pool = pool.slice().sort((a, b) => (b[sort] || 0) - (a[sort] || 0) || b.cost - a.cost);
  return { top: pool.slice(0, D.top), fallback };
}
const CARD_MX = ['cost', 'ctr', 'cpc', 'click'].concat(D.has.conversion ? ['conversion'] : ['impression'])
  .concat(D.has.revenue ? ['roas'] : D.has.conversion ? ['cvr'] : []);
function card(x, i, mediaCost, noImages) {
  const share = mediaCost ? x.cost / mediaCost * 100 : 0;
  const isNew = D.prev.ok && (!x.prev || !x.prev[0]);
  const path = [x.campaign_name, x.ad_group_name].filter(p => p && p !== x.name);
  const badges = `<div class="cr-badges"><span class="cr-rank">${i + 1}</span>${isNew ? '<span class="cr-new" title="직전 기간에는 집행하지 않은 소재">신규</span>' : ''}</div>`;
  const a = atoms(x);
  return `<article class="cr-card">
    ${noImages ? '' : `<div class="cr-shot">${x.thumb ? `<img src="${x.thumb}" alt="${esc(x.name)}" tabindex="0">` : ''}${badges}</div>`}
    <div class="cr-body">
      ${noImages ? badges : ''}
      <div><div class="cr-name" title="${esc(x.name)}">${esc(x.name)}</div>
        ${path.length ? `<div class="cr-path" title="${esc(path.join(' › '))}">${esc(path.join(' › '))}</div>` : ''}</div>
      <div class="cr-share" title="이 소재가 매체 광고비에서 차지하는 비중"><div class="lh-bar"><div class="lh-bar-fill" style="--w:${Math.min(100, share).toFixed(1)}%"></div></div>
        <span>매체 광고비의 <b>${share.toFixed(1)}%</b></span></div>
      <dl class="cr-mx">${CARD_MX.map(k => { const m = M(k);
        return `<div class="${k === st.sort ? 'hl' : ''}"><dt>${m.l}</dt><dd><span>${f[m.fm](m.v(a))}</span>${isNew ? '' : deltaHtml(a, x.prev, m)}</dd></div>`; }).join('')}</dl>
    </div></article>`;
}
function drawGroups() {
  const label = (D.sorts.find(s => s[0] === st.sort) || ['', ''])[1];
  if (!visible().length) { $('groups').innerHTML = '<div class="lh-placeholder">선택한 매체가 없습니다. 위에서 매체를 하나 이상 골라 주세요.</div>'; return; }
  const blocks = D.media.filter(g => !st.hidden.has(g.summary.media)).map(g => {
    const m = g.summary, r = rank(g.rows, st.sort);
    const topCost = r.top.reduce((acc, x) => acc + x.cost, 0), rest = g.rows.length - r.top.length;
    const noImages = !g.rows.some(x => x.thumb);
    return `<div class="cr-media">
      <div class="cr-media-head"><span class="nm">${mdot(m.media)}${esc(m.media)}</span>
        <span class="st">광고비<b>${f.money(m.cost)}</b></span>
        <span class="st">CTR<b>${f.pct(m.ctr)}</b></span>
        <span class="st">소재<b>${m.creatives}개</b></span>
        <span class="st">상위 ${r.top.length}개 소재가 쓴 광고비<b>${m.cost ? (topCost / m.cost * 100).toFixed(1) : '0.0'}%</b></span>
        ${rest > 0 ? `<span class="st">나머지 소재 ${rest}개는 아래 세부 광고 성과 표에서 볼 수 있습니다</span>` : ''}</div>
      <div class="cr-grid">${r.top.map((x, i) => card(x, i, m.cost, noImages)).join('')}</div>
      ${r.fallback ? `<p class="lh-note">조건을 채운 소재가 없어 모든 소재로 ${esc(label)} 순위를 매겼습니다.</p>` : ''}
    </div>`;
  });
  $('groups').innerHTML = blocks.join('');
}

// ── 소재 Summary: 다른 보고서와 같은 요약 불릿(모델이 guides/creative-summary.md를 따라 씀). <strong>만 허용 ──
(function drawSummary() {
  const items = D.summary || [];
  if (!items.length) { $('summary-sec').style.display = 'none'; return; }
  $('summary-meta').textContent = '모든 매체를 합친 기준입니다(위 매체 선택과 상관없음).' + (D.prev.ok ? ` 직전 기간(${dots(D.prev.start)} ~ ${dots(D.prev.end)})과 비교했습니다.` : '');
  const rich = t => esc(t).replace(/&lt;(\/?)strong&gt;/g, '<$1strong>');
  $('summary').innerHTML = '<ul class="lh-bullets">' + items.map(it =>
    `<li class="lh-bullet tone-${['red', 'green', 'yellow'].includes(it.tone) ? it.tone : 'neutral'}"><span class="lh-dot"></span>
      <span class="lh-bullet-text">${it.head ? `<strong>${esc(it.head)}</strong> ` : ''}<span>${rich(it.text || '')}</span></span></li>`).join('') + '</ul>';
})();

// ── 매체별 일별 추이(다른 보고서의 추이 그래프와 같은 탭·범례) ──
const TR = { view: 'media', metric: 'cost', chart: null, off: new Set() };
const TRM = METRICS.filter(m => m.k !== 'cvr');
function drawTrend() {
  if (!D.trend || !window.Chart) { $('trend-sec').style.display = 'none'; return; }
  const names = Object.keys(D.trend.media), media = names.filter(n => !st.hidden.has(n));
  const m = TRM.find(x => x.k === TR.metric) || TRM[0];
  const at = i => media.reduce((acc, k) => add(acc, D.trend.media[k][i]), ZERO);
  const series = TR.view === 'total'
    ? [{ name: '선택한 매체 합계', color: '#2a78d6', raw: D.trend.dates.map((_, i) => at(i)) }]
    : media.filter(k => !TR.off.has(k)).map(k => ({ name: k, color: colorOf(k), raw: D.trend.media[k] }));
  $('tr-metric').innerHTML = TRM.map(x => `<button type="button" class="lh-tab${TR.metric === x.k ? ' is-on' : ''}" data-k="${x.k}">${x.l}</button>`).join('');
  $('tr-view').innerHTML = [['media', '매체별'], ['total', '전체 합계']].map(([k, l]) => `<button type="button" class="lh-tab${TR.view === k ? ' is-on' : ''}" data-v="${k}">${l}</button>`).join('');
  $('tr-legend').innerHTML = TR.view === 'total' ? '' : media.map(k => {
    const tot = D.trend.media[k].reduce((acc, v) => add(acc, v), ZERO);
    return `<button type="button" class="lh-legend-item${TR.off.has(k) ? ' is-off' : ''}" data-l="${esc(k)}"><span class="lh-swatch" style="--c:${colorOf(k)}"></span>${esc(k)} <span class="lh-legend-val">${f[m.fm](m.v(tot))}</span></button>`;
  }).join('');
  if (TR.chart) TR.chart.destroy();
  if (!media.length) { $('tr-legend').innerHTML = '<span class="lh-muted">선택한 매체가 없습니다.</span>'; return; }
  const days = D.trend.dates.map(d => new Date(d + 'T00:00:00'));
  const W = ['일', '월', '화', '수', '목', '금', '토'];
  const tick = v => m.fm === 'money' ? f.short(v) : m.fm === 'int' ? (v >= 1e4 ? Math.round(v / 1e3) + 'K' : f.int(v)) : f.pct(v);
  TR.chart = new Chart($('tr-cv'), {
    type: 'line',
    // 광고를 집행하지 않은 날(광고비·노출 0)은 점을 찍지 않고 선을 끊는다
    data: { labels: days.map(d => `${d.getMonth() + 1}/${d.getDate()}(${W[d.getDay()]})`),
      datasets: series.map(x => ({ label: x.name, raw: x.raw, data: x.raw.map(a => (a[0] || a[1]) ? fin(m.v(a)) : null),
        borderColor: x.color, backgroundColor: x.color, tension: 0.3, pointRadius: 3, borderWidth: 2, spanGaps: false })) },
    options: { responsive: true, maintainAspectRatio: false, animation: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { display: false },
        tooltip: { callbacks: { label: c => {
          const a = c.dataset.raw[c.dataIndex];
          const base = m.k === 'ctr' ? ` (노출 ${f.int(a[1])})` : m.k === 'cpc' ? ` (클릭 ${f.int(a[2])})` : m.k === 'roas' ? ` (광고비 ${f.money(a[0])})` : '';
          return `${c.dataset.label}: ${f[m.fm](c.parsed.y)}${base}`; } } } },
      scales: { x: { grid: { display: false }, ticks: { maxRotation: 0, autoSkipPadding: 14 } },
        y: { beginAtZero: true, grid: { color: '#f1f5f9' }, ticks: { maxTicksLimit: 6, callback: tick } } } },
  });
}
$('tr-view').addEventListener('click', e => { const b = e.target.closest('button[data-v]'); if (b) { TR.view = b.dataset.v; drawTrend(); } });
$('tr-metric').addEventListener('click', e => { const b = e.target.closest('button[data-k]'); if (b) { TR.metric = b.dataset.k; drawTrend(); } });
$('tr-legend').addEventListener('click', e => { const b = e.target.closest('button[data-l]'); if (!b) return; const k = b.dataset.l; TR.off.has(k) ? TR.off.delete(k) : TR.off.add(k); drawTrend(); });

// ── 세부 광고 성과: 웹 세부 표와 같은 구조(단계별 열, 하위가 있는 줄은 다음 단계 칸에 '전체', 이번 기간 썸네일,
//    정렬은 오름 → 내림 → 해제) ──
const LV = ['매체', '캠페인', '광고그룹', '광고'];
(function collapse(ns) {   // 하위가 같은 이름의 소재 하나뿐인 줄은 한 줄로
  ns.forEach(n => { collapse(n.k); if (n.k.length === 1 && !n.k[0].k.length && n.k[0].n === n.n) { n.t = n.k[0].t; n.k = []; } });
})(D.tree);
let uid = 0;
(function tag(ns, d) { ns.forEach(n => { n.id = ++uid; n.d = d; tag(n.k, d + 1); }); })(D.tree, 0);
const dt = { open: new Set(), depth: 0, sort: null, q: '' };
const hasImg = ns => ns.some(n => n.t || hasImg(n.k));
const maxLv = ns => ns.reduce((a, n) => Math.max(a, n.d, maxLv(n.k)), 0);
const matches = n => n.n.toLowerCase().includes(dt.q) || n.k.some(matches);
function sorted(ns) {
  if (!dt.sort) return ns;
  const m = METRICS[dt.sort.i], s = dt.sort.dir === 'asc' ? 1 : -1, val = n => { const v = fin(m.v(n.c)); return v == null ? -Infinity : v; };
  return ns.slice().sort((a, b) => (val(a) - val(b)) * s);
}
function drawTree() {
  const roots = D.tree.filter(n => !st.hidden.has(n.n));
  if (!roots.length) { $('dt').innerHTML = '<tbody><tr><td class="lh-empty">선택한 매체가 없습니다.</td></tr></tbody>'; $('dt-depth').innerHTML = ''; return; }
  const img = hasImg(roots), levels = LV.slice(0, maxLv(roots) + 1);
  const head = '<thead><tr>' + levels.map((l, i) => `<th class="lv${i ? '' : ' sticky'}">${l}</th>`).join('')
    + (img ? '<th>이미지</th>' : '')
    + METRICS.map((m, i) => { const on = dt.sort && dt.sort.i === i;
      return `<th class="num sortable${on ? ' sorted' : ''}" data-i="${i}" aria-sort="${on ? (dt.sort.dir === 'asc' ? 'ascending' : 'descending') : 'none'}">${m.l}<span class="sort">${on ? (dt.sort.dir === 'asc' ? '▲' : '▼') : '↕'}</span></th>`; }).join('')
    + '</tr></thead>';
  const out = [];
  (function walk(ns) {
    sorted(ns).forEach(n => {
      if (dt.q && !matches(n)) return;
      const kids = n.k.length > 0, open = dt.q ? true : dt.open.has(n.id);
      const cells = levels.map((_, lv) => {
        let s = '';
        if (n.d === lv) s = `<span class="item">${kids ? `<button type="button" class="lh-caret${open ? '' : ' is-closed'}" data-id="${n.id}" aria-expanded="${open}" aria-label="${open ? '접기' : '펼치기'}">▼</button>` : '<span class="lh-caret ph">▼</span>'}${lv === 0 ? mdot(n.n) : ''}<span class="tx" title="${esc(n.n)}">${esc(n.n)}</span></span>`;
        else if (n.d + 1 === lv && kids) s = '<span class="all">전체</span>';
        return `<td class="lv${lv ? '' : ' sticky'}">${s}</td>`;
      }).join('');
      out.push(`<tr class="lv-${n.d}">${cells}` + (img ? `<td style="text-align:center">${n.t ? `<img class="cr-thumb" src="${n.t}" alt="${esc(n.n)}" tabindex="0">` : ''}</td>` : '')
        + METRICS.map(m => `<td class="num"><span class="vc"><span>${f[m.fm](m.v(n.c))}</span>${deltaHtml(n.c, n.p, m)}</span></td>`).join('') + '</tr>');
      if (kids && open) walk(n.k);
    });
  })(roots);
  $('dt').innerHTML = head + '<tbody>' + (out.join('') || `<tr><td class="lh-empty" colspan="${levels.length + METRICS.length + 1}">검색어와 맞는 캠페인·광고가 없습니다.</td></tr>`) + '</tbody>';
  $('dt-depth').innerHTML = LV.slice(1, levels.length).map((l, i) => `<button type="button" class="lh-tab${dt.depth === i + 1 ? ' is-on' : ''}" data-d="${i + 1}">${l}</button>`).join('');
}
function openTo(depth) {
  dt.depth = depth; dt.open.clear();
  (function op(ns) { ns.forEach(n => { if (n.d < depth && n.k.length) { dt.open.add(n.id); op(n.k); } }); })(D.tree);
}
$('dt').addEventListener('click', e => {
  const c = e.target.closest('.lh-caret[data-id]');
  if (c) { const id = +c.dataset.id; dt.open.has(id) ? dt.open.delete(id) : dt.open.add(id); return drawTree(); }
  const th = e.target.closest('th.sortable');
  if (th) {   // 오름 → 내림 → 해제(웹과 같음)
    const i = +th.dataset.i;
    dt.sort = !dt.sort || dt.sort.i !== i ? { i, dir: 'asc' } : dt.sort.dir === 'asc' ? { i, dir: 'desc' } : null;
    drawTree();
  }
});
$('dt-depth').addEventListener('click', e => {
  const b = e.target.closest('button[data-d]'); if (!b) return;
  const d = +b.dataset.d; openTo(dt.depth === d ? 0 : d); drawTree();   // 다시 누르면 접는다
});
$('dt-q').addEventListener('input', e => { dt.q = e.target.value.trim().toLowerCase(); drawTree(); });
$('dt-meta').textContent = D.prev.ok
  ? `매체 › 캠페인 › 광고그룹 › 광고 순으로 펼쳐 봅니다. 값 아래 숫자는 직전 기간(${dots(D.prev.start)} ~ ${dots(D.prev.end)})과 비교한 증감이고, 비율 지표는 %p로, 직전 값이 없으면 —로 표시합니다.`
  : '매체 › 캠페인 › 광고그룹 › 광고 순으로 펼쳐 봅니다. 직전 기간 데이터가 없어 증감은 표시하지 않습니다.';

// ── 이미지 크게 보기 ──
const zoom = $('zoom');
function openZoom(src, alt) { const i = zoom.querySelector('img'); i.src = src; i.alt = alt || ''; zoom.classList.add('on'); }
document.addEventListener('click', e => {
  if (e.target.matches('.cr-shot img, .cr-thumb')) openZoom(e.target.src, e.target.alt);
  else if (e.target.closest('#zoom')) zoom.classList.remove('on');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') zoom.classList.remove('on');
  if (e.key === 'Enter' && e.target.matches('.cr-shot img, .cr-thumb')) openZoom(e.target.src, e.target.alt);
});

// ── 인쇄: 세부 표를 광고 단계까지 펼치고 그래프 크기를 다시 잰다(끝나면 되돌린다) ──
let saved = null;
window.addEventListener('beforeprint', () => { saved = { open: new Set(dt.open), depth: dt.depth }; openTo(LV.length - 1); drawTree(); if (TR.chart) TR.chart.resize(); });
window.addEventListener('afterprint', () => { if (saved) { dt.open = saved.open; dt.depth = saved.depth; saved = null; drawTree(); } if (TR.chart) TR.chart.resize(); });

function draw() { drawControls(); drawKpis(); drawGroups(); drawTrend(); drawTree(); }
draw();
</script>
</body>
</html>
